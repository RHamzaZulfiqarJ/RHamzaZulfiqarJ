<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Hamza Zulfiqar — AI engineer and full-stack developer</title>
  <desc id="desc">A dark, animated profile banner with a simple product-to-model-to-interface flow.</desc>
  <defs>
    <clipPath id="frame"><rect x="18" y="18" width="1164" height="384" rx="22"/></clipPath>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="28" fill="#080f1d"/>
  <g clip-path="url(#frame)">
    <rect x="18" y="18" width="1164" height="384" rx="22" fill="#0b1424" stroke="#243449" stroke-width="2"/>

    <text x="74" y="90" fill="#5eead4" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700" letter-spacing="3">HAMZA ZULFIQAR</text>
    <rect x="74" y="111" width="82" height="4" rx="2" fill="#5eead4">
      <animate attributeName="width" values="38;82;38" dur="3.8s" repeatCount="indefinite"/>
    </rect>

    <text x="68" y="200" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" letter-spacing="-2">AI ENGINEER</text>
    <text x="68" y="276" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="67" font-weight="800" letter-spacing="-2">&amp; FULL-STACK</text>
    <text x="68" y="352" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="800" letter-spacing="-2">DEVELOPER</text>
    <rect x="506" y="323" width="6" height="34" fill="#a78bfa">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>

    <rect x="803" y="62" width="324" height="298" rx="18" fill="#111d30" stroke="#34445c" stroke-width="2"/>
    <text x="832" y="105" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace" font-size="15" letter-spacing="2">HOW I WORK</text>
    <line x1="844" y1="146" x2="844" y2="305" stroke="#34445c" stroke-width="4" stroke-linecap="round"/>
    <line x1="844" y1="146" x2="844" y2="305" stroke="url(#flow)" stroke-width="4" stroke-linecap="round" stroke-dasharray="52 108">
      <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="3.4s" repeatCount="indefinite"/>
    </line>

    <g font-family="Arial, Helvetica, sans-serif">
      <circle cx="844" cy="151" r="9" fill="#5eead4"/>
      <text x="869" y="157" fill="#e2e8f0" font-size="20" font-weight="700">Understand the problem</text>
      <circle cx="844" cy="226" r="9" fill="#a78bfa"/>
      <text x="869" y="232" fill="#e2e8f0" font-size="20" font-weight="700">Build the system</text>
      <circle cx="844" cy="301" r="9" fill="#5eead4"/>
      <text x="869" y="307" fill="#e2e8f0" font-size="20" font-weight="700">Make AI useful</text>
    </g>

    <text x="832" y="344" fill="#94a3b8" font-family="Consolas, 'Courier New', monospace" font-size="13" letter-spacing="1">MODELS  /  APIS  /  INTERFACES</text>
  </g>
</svg>
