<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Hamza Zulfiqar — systems in motion</title>
  <desc id="desc">Animated engineering system map for a full-stack and applied AI engineer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050912"/>
      <stop offset="0.52" stop-color="#0b1f33"/>
      <stop offset="1" stop-color="#071a26"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94a3b8" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="viewport"><rect x="26" y="26" width="1148" height="368" rx="24"/></clipPath>
  </defs>

  <rect width="1200" height="420" rx="30" fill="#020617"/>
  <rect x="14" y="14" width="1172" height="392" rx="28" fill="url(#bg)" stroke="#1e3a52"/>
  <g clip-path="url(#viewport)">
    <rect x="26" y="26" width="1148" height="368" fill="url(#grid)"/>
    <circle cx="980" cy="40" r="260" fill="url(#halo)">
      <animate attributeName="cx" values="980;1060;980" dur="10s" repeatCount="indefinite"/>
    </circle>
    <rect x="26" y="-40" width="1148" height="80" fill="url(#beam)" opacity="0.05">
      <animate attributeName="y" values="-80;420" dur="5.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="68" y="72" fill="#64748b" font-size="14" letter-spacing="3">HZ / SYSTEM MAP / 2026</text>
    <circle cx="1090" cy="67" r="5" fill="#34d399" filter="url(#glow)">
      <animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="1105" y="73" fill="#86efac" font-size="13">BUILDING</text>

    <text x="68" y="152" fill="#f8fafc" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="64" font-weight="750" letter-spacing="-1">HAMZA ZULFIQAR</text>
    <text x="70" y="194" fill="#bae6fd" font-size="20" letter-spacing="5">FULL-STACK × APPLIED AI ENGINEER</text>
    <text x="70" y="230" fill="#94a3b8" font-size="16">I engineer the path from ambiguous workflow to dependable product.</text>

    <g transform="translate(70 292)">
      <path d="M70 24H258M328 24H516M586 24H774M844 24H1014" stroke="#334155" stroke-width="2" stroke-dasharray="7 9">
        <animate attributeName="stroke-dashoffset" from="32" to="0" dur="2.2s" repeatCount="indefinite"/>
      </path>

      <g transform="translate(0)">
        <rect width="140" height="48" rx="12" fill="#082f49" stroke="#0ea5e9"/>
        <text x="70" y="30" fill="#e0f2fe" font-size="14" text-anchor="middle">WORKFLOW</text>
      </g>
      <g transform="translate(258)">
        <rect width="140" height="48" rx="12" fill="#2e1065" stroke="#8b5cf6"/>
        <text x="70" y="30" fill="#ede9fe" font-size="14" text-anchor="middle">MODEL</text>
      </g>
      <g transform="translate(516)">
        <rect width="140" height="48" rx="12" fill="#052e2b" stroke="#14b8a6"/>
        <text x="70" y="30" fill="#ccfbf1" font-size="14" text-anchor="middle">BOUNDARY</text>
      </g>
      <g transform="translate(774)">
        <rect width="140" height="48" rx="12" fill="#052e16" stroke="#22c55e"/>
        <text x="70" y="30" fill="#dcfce7" font-size="14" text-anchor="middle">PRODUCT</text>
      </g>

      <circle r="6" fill="#ffffff" filter="url(#glow)">
        <animateMotion dur="5.2s" repeatCount="indefinite" path="M140 24H258M398 24H516M656 24H774"/>
        <animate attributeName="fill" values="#38bdf8;#a78bfa;#34d399" dur="5.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="70" y="380" fill="#475569" font-size="12" letter-spacing="2">TYPE SAFETY / TENANT BOUNDARIES / HUMAN-CONTROLLED AI / RELEASE CONFIDENCE</text>
    <text x="1123" y="380" fill="#38bdf8" font-size="19">▮
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
