<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="92" viewBox="0 0 1200 92" role="img" aria-labelledby="title desc">
  <title id="title">Interfaces, systems, intelligence</title>
  <desc id="desc">A subtle animated line joining three parts of Hamza's work.</desc>
  <rect width="1200" height="92" rx="18" fill="#0b1424"/>
  <rect x="1" y="1" width="1198" height="90" rx="17" fill="none" stroke="#243449" stroke-width="2"/>
  <path d="M288 46H420M780 46H912" fill="none" stroke="#34445c" stroke-width="3"/>
  <path d="M288 46H420M780 46H912" fill="none" stroke="#5eead4" stroke-width="3" stroke-dasharray="28 240">
    <animate attributeName="stroke-dashoffset" from="0" to="-268" dur="3.5s" repeatCount="indefinite"/>
  </path>
  <g fill="#e2e8f0" font-family="Consolas, 'Courier New', monospace" font-size="19" font-weight="700" letter-spacing="2" text-anchor="middle">
    <text x="154" y="53">INTERFACES</text>
    <text x="600" y="53">SYSTEMS</text>
    <text x="1040" y="53">INTELLIGENCE</text>
  </g>
</svg>
